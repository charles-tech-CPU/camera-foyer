server:
  port: 8086

app:
  videos:
    # Dossier ou le script de nuit depose une video par jour (AAAA-MM-JJ.mp4)
    dir: ${VIDEOS_DIR:/var/lib/motion/jours}
  cors:
    # Liste de motifs separes par des virgules (ex: http://*:8186,https://*:8286).
    # Absente ou vide : Vite en LAN et acces HTTPS via Tailscale (WebConfig.DEFAULT_ALLOWED_ORIGINS).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
