# Sert l'appli Vue buildee et, sous /videos/, les videos journalieres de la camera.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Videos AAAA-MM-JJ.mp4 lues directement sur le disque (volume Docker monte sur
    # /usr/share/nginx/videos/), sans passer par le backend. nginx gere nativement les
    # requetes Range (reponse 206) sur les fichiers statiques : c'est ce qui permet au
    # lecteur <video> d'avancer/reculer sans telecharger tout le fichier.
    location /videos/ {
        alias /usr/share/nginx/videos/;
        autoindex off;
        sendfile on;
        tcp_nopush on;
        # Une video peut etre supprimee depuis l'appli : le navigateur revalide a chaque lecture
        add_header Cache-Control "no-cache";
    }

    # Page unique : toute autre URL renvoie l'appli
    location / {
        try_files $uri $uri/ /index.html;
    }
}
